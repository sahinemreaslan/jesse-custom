[GENETIC_ALGORITHM]
population_size = 100
num_generations = 50
crossover_prob = 0.7
mutation_prob = 0.2
tournament_size = 3
elitism_count = 5

[BACKTESTING]
initial_capital = 10000
commission_pct = 0.1
slippage_pct = 0.05
use_vectorized = true

[DATA]
cache_enabled = true
cache_dir = data/cache
data_source = binance
default_timeframe = 1h

[OPTIMIZATION]
fitness_metric = sharpe_ratio
# Options: sharpe_ratio, total_return, calmar_ratio, sortino_ratio, composite
min_trades = 30
parallel_enabled = true
save_all_generations = false

[LIVE_TRADING]
enabled = false
mode = paper  # paper or live
check_interval = 60  # seconds
